[package]
name = "vectrize"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
description = "Local and fast semantic search over folders of Markdown documents, built for you and your AI agents."
keywords = ["search", "semantic", "markdown", "embeddings", "cli"]
categories = ["command-line-utilities", "text-processing"]
repository = "https://github.com/pablofrr/vectrize"
homepage = "https://github.com/pablofrr/vectrize"
license = "MIT OR Apache-2.0"
include = ["src/**", "tests/**", "README.md", "LICENSE-*"]

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive", "env"] }
fastembed = { version = "7.1.0", default-features = false, features = ["ort-download-binaries-rustls-tls"] }
hf-hub = { version = "0.4", default-features = false, features = ["ureq"] }
ignore = "0.4.33"
libc = "0.2.189"
notify = "8.2.0"
num_cpus = "1.17.0"
pulldown-cmark = { version = "0.13.4", default-features = false }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlite-vec = "0.1.9"
text-splitter = { version = "0.33.0", features = ["markdown", "tokenizers"] }
tokenizers = { version = "0.23.2", default-features = false }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

