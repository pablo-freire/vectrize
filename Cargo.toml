[package]
name = "vectrize"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
fastembed = { version = "7.1.0", default-features = false, features = ["ort-download-binaries-rustls-tls"] }
hf-hub = { version = "0.4", default-features = false, features = ["ureq"] }
model2vec-rs = "0.3.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
sqlite-vec = "0.1.9"
walkdir = "2.5.0"
